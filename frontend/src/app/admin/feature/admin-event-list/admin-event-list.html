<p-card class="w-full">
  <div class="gap-4 flex flex-col w-full">
    <div class="flex flex-col md:flex-row items-center justify-between w-full">
      <p-iconfield class="align-middle w-full">
        <p-inputicon class="pi pi-search align-baseline"/>
        <input pInputText type="text" placeholder="Search" class="w-full"/>
      </p-iconfield>
      <p-paginator
        [rows]="countPage()"
        [totalRecords]="countTotal()"
        (onPageChange)="onPageChange($event)"
        [showCurrentPageReport]="true"
        currentPageReportTemplate="{first} - {last} of {totalRecords}"
        [showPageLinks]="false"
        [showFirstLastIcon]="false"
        class="min-w-fit"
      ></p-paginator>
    </div>
    <p-scrollpanel class="w-full h-screen" [style]="{ width: '100%', height: '75vh' }">
      <div class="flex flex-col gap-4">
        @for (event of events(); track event.id) {
          <app-admin-event-card [name]="event.title!" [description]="event.description!" [flagCount]="event.flags!.length" (click)="eventClicked(event.id!)" class="w-full"/>
        }
      </div>
    </p-scrollpanel>
  </div>
</p-card>
