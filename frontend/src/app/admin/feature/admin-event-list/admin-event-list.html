<p-card class="w-full h-full">
  <div class="gap-4 flex flex-col w-full">
    <div class="flex flex-col md:flex-row items-center justify-between w-full">
      <p-iconfield class="align-middle w-full">
        <p-inputicon class="pi pi-search align-baseline"/>
        <input pInputText type="text" placeholder="Search" class="w-full"/>
      </p-iconfield>
      <p-paginator
        [rows]="countPage()"
        [totalRecords]="countTotal()"
        (onPageChange)="changePage($event)"
        [showCurrentPageReport]="true"
        currentPageReportTemplate="{first} - {last} of {totalRecords}"
        [showPageLinks]="false"
        [showFirstLastIcon]="false"
        class="min-w-fit"
      ></p-paginator>
    </div>
    <p-scrollpanel class="w-full border-gray-200 border rounded-2xl p-2 h-[calc(100vh-16em)]">
      <div class="flex flex-col gap-4 w-full">
        @for (event of events(); track event.id) {
          <app-admin-event-card [name]="event.title!" [description]="event.description!"
                                [flagCount]="event.flags!.length" (click)="clickEvent(event)" class="w-full"
                                [status]="event.status!"/>
        }
      </div>
    </p-scrollpanel>
  </div>
</p-card>
