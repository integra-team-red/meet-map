<p-card>
  <ng-template #title>
    <div class="flex items-center gap-1">
      @if (canModify()) {
        <p-button (onClick)="edit.emit()"
                  ariaLabel="Edit your review"
                  [icon]="'pi pi-pencil'"
                  rounded
                  size="small"
                  variant="text"
        />
        <p-button (onClick)="remove.emit()"
                  ariaLabel="Delete your review"
                  [icon]="'pi pi-trash'"
                  rounded
                  size="small"
                  variant="text"
        />
      }
      <p-rating [ngModel]="rating()" [readonly]="true"/>
    </div>
  </ng-template>

  <ng-template #content>
    @if (comment()) {
      <p class="text-sm whitespace-pre-line break-words">
        {{ comment() }}
      </p>
    }
    <div class="flex items-center gap-2 mt-3">
      <p-avatar [image]="userImagePlaceholderURL()" shape="circle"/>
      <div class="flex flex-col">
        <span class="text-sm font-semibold">
          {{ authorName() }}
        </span>
        <span class="text-xs text-gray-500">
          {{ date() | date: 'd MMM y' }}
        </span>
      </div>
    </div>
  </ng-template>
</p-card>
