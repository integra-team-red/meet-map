<p-card>
  <ng-template #title>
    <div>
      <div class="flex justify-end shrink-0">
        <p-rating [ngModel]="rating()" [readonly]="true"/>
      </div>
    </div>
  </ng-template>

  <ng-template #content>
    @if (comment()) {
      <p class="text-sm whitespace-pre-line break-words">
        {{ comment() }}
      </p>
    }
    <div class="flex items-center gap-2 mt-3">
      <p-avatar [image]="userImagePlaceholderURL()" shape="circle"/>
      <div class="flex flex-col">
        <span class="text-sm font-semibold">
          {{ authorName() }}
        </span>
        <span class="text-xs text-gray-500">
          {{ date() | date: 'd MMM y' }}
        </span>
      </div>
    </div>
  </ng-template>
</p-card>
