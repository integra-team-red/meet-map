<section class="max-w-3xl mx-auto rounded-lg border border-gray-200 overflow-hidden">

  <div class="border-b border-gray-200 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">

      <a
        [routerLink]="['/events', id()]"
        class="text-gray-500 hover:text-gray-700"
        aria-label="Back to event"
      >
        <i class="pi pi-arrow-left"></i>
      </a>

      <h2 class="text-xl flex items-center gap-2">
        <i class="pi pi-comments"></i>
        Event Chat
      </h2>

    </div>

    <p-button
      icon="pi pi-refresh"
      [text]="true"
      [rounded]="true"
      [loading]="loading()"
      (onClick)="refresh()"
    />
  </div>

  @if (loading()) {
    <div class="p-6 text-center text-gray-500">
      Connecting to chat...
    </div>
  }

  @if (error(); as errorMessage) {
    <div class="p-4">
      <p-message severity="error" styleClass="w-full">
        {{ errorMessage }}
      </p-message>
    </div>
  }

  @if (!loading() && !error()) {
    <div class="h-80 overflow-y-auto p-4 flex flex-col gap-4">

      @for (message of messages(); track message.id) {
        <div>
          <div class="text-sm font-semibold">
            {{ message.sender }}
          </div>

          <div class="mt-1 wrap-break-word">
            {{ message.content }}
          </div>
        </div>
      } @empty {
        <div class="flex-1 flex items-center justify-center text-gray-500">
          No messages yet. Start the conversation!
        </div>
      }

    </div>

    <div class="border-t border-gray-200 p-3 flex gap-2">

      <input
        class="flex-1 min-w-0 border border-gray-300 rounded-lg px-3 py-2"
        type="text"
        placeholder="Write a message..."
        [(ngModel)]="messageText"
        (keydown.enter)="sendMessage()"
      />

      <p-button
        icon="pi pi-send"
        label="Send"
        [loading]="sending()"
        [disabled]="!messageText().trim() || sending()"
        (onClick)="sendMessage()"
      />

    </div>
  }

</section>
