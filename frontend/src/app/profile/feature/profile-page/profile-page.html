@if (loading()) {
  <div class="flex justify-center p-12">
    <i class="pi pi-spin pi-spinner text-3xl text-indigo-500"></i>
  </div>
} @else if (error()) {
  <div class="p-12 text-center text-red-600">{{ error() }}</div>
} @else if (user(); as u) {
  <div class="mx-auto max-w-6xl p-4 flex flex-col md:flex-row md:gap-8">

    <aside class="md:w-1/3 flex flex-col gap-6 pb-6 md:pb-0 md:pr-8 md:border-r md:border-indigo-300">
      <div class="flex flex-col items-center gap-4">
        <p-avatar icon="pi pi-user" shape="circle"
                  class="!w-32 !h-32 !text-6xl !bg-transparent border-2 border-indigo-500"/>
        <span class="text-xl font-bold text-center">{{ u.firstName }} {{ u.lastName }}</span>
        <span class="break-all text-center select-all">{{ matrixId }}</span>
      </div>

      <dl class="flex flex-col gap-1">
        <dt>Email:</dt>
        <dd class="break-all mb-2">{{ u.email }}</dd>
        <dt>Password:</dt>
        <dd>********</dd>
      </dl>

      <p class="font-bold">Do not share your password with anyone!</p>

      <div class="flex flex-row md:flex-col gap-2">
        <p-button label="Change password" styleClass="w-full !border-indigo-400"/>
        <p-button label="Edit profile" styleClass="w-full !border-indigo-400"/>
      </div>
    </aside>

    <section class="flex-1 flex flex-col gap-4 pt-6 md:pt-0">
      <h1 class="text-2xl md:text-4xl font-bold">Your recent activity</h1>

      <div class="rounded-xl border border-indigo-200 p-4 md:p-6">
        <h2 class="text-lg md:text-2xl font-bold">Labels</h2>
      </div>

      <div class="rounded-xl border border-indigo-200 p-4 md:p-6">
        <h2 class="text-lg md:text-2xl font-bold">Your events</h2>
      </div>

      <div class="rounded-xl border border-indigo-200 p-4 md:p-6">
        <h2 class="text-lg md:text-2xl font-bold">Joined Events</h2>
      </div>
    </section>
  </div>
}
