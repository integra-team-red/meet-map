<div class="min-h-[80vh] rounded-xl bg-linear-to-br from-primary-300 to-primary flex items-center justify-center p-4">
  <div class="w-full max-w-5xl flex items-stretch gap-8 p-4">
    <div class="hidden md:block flex-1 rounded-xl bg-gray-200"></div>

    <form [formGroup]="form"
          (ngSubmit)="submit()"
          class="flex-1 bg-white rounded-xl p-8 flex flex-col gap-4">
      <h1 class="text-3xl font-bold text-center">Log in</h1>
      <div class="text-center w-full">
        <span class="text-surface-700 dark:text-surface-200 leading-normal">Don't have an account?</span>
        <a routerLink="/signup" class="text-primary font-medium ml-1 hover:opacity-80">Sign Up!</a>
      </div>

      <div class="flex flex-col gap-1">
        <label for="email">Email address</label>
        <input pInputText id="email" type="email" formControlName="email" autocomplete="email" class="w-full"/>
        @if (form.controls.email.invalid && form.controls.email.touched) {
          <small class="text-red-600">Please enter a valid email address.</small>
        }
      </div>

      <div class="flex flex-col gap-1">
        <label for="password">Password</label>
        <p-password inputId="password"
                    formControlName="password" [feedback]="false"
                    [toggleMask]="true"
                    autocomplete="current-password"
                    class="w-full"
                    [inputStyleClass]="'w-full'"/>
        @if (form.controls.password.invalid && form.controls.password.touched) {
          <small class="text-red-600">Password is required.</small>
        }
      </div>

      <div class="flex items-center gap-2">
        <p-checkbox inputId="remember" formControlName="rememberMe"
                    [binary]="true"/>
        <label for="remember">Remember Me</label>
      </div>

      @if (error()) {
        <small class="text-red-600 text-center">{{ error() }}</small>
      }

      <p-button type="submit" label="Log in" [loading]="loading()"
                styleClass="w-full"/>
    </form>
  </div>
</div>
