<div class="flex flex-col gap-4">
  <div>
    <p-iconfield>
      <p-inputicon class="pi pi-search" />
      <input type="text" pInputText placeholder="Search" fluid/>
    </p-iconfield>
  </div>

  <div class="flex flex-col lg:flex-row gap-4">
    <div>
      <p-card class="lg:w-2xs ">
        <p-accordion value="0">
          <p-accordion-panel value="0">
            <p-accordion-header>Filters</p-accordion-header>
            <p-accordion-content>
              <p-select [options]="options" [(ngModel)]="sortOrder" optionLabel="name" placeholder="Sort by" fluid/>
            </p-accordion-content>
          </p-accordion-panel>
        </p-accordion>
      </p-card>
    </div>
    <div class="flex flex-row flex-wrap gap-4 lg:max-w-96">
      @for (event of events(); track event.id) {
        <app-event-card
          (click)="doSomething(event.id!)"
          class="w-full"
          [name]="event.title!"
          [location]="event.city + ' ' + event.address"
          [tags]="event.tagIds!"
        />
      }
    </div>
  </div>
</div>
