<p-accordion>
  <p-accordion-panel value="0">
    <p-accordion-header>
      <span class="flex items-center gap-2">
        <i class="pi pi-flag text-red-500"></i>
        Reports ({{ flags().length }})
      </span>
    </p-accordion-header>
    <p-accordion-content>
      @if (flags().length === 0) {
        <p class="text-gray-500 text-sm">This event has no flags.</p>
      } @else {
        <div class="flex flex-col gap-2">
          @for (flag of flags(); track flag.id) {
            <div class="border-gray-200 border rounded-xl p-2 flex flex-col">
              <span class="text-gray-500 text-xs">
                Report #{{ flag.id }} &middot; by user {{ flag.userId }}
              </span>
              <p class="whitespace-pre-wrap break-words">{{ flag.reason }}</p>
            </div>
          }
        </div>
      }
    </p-accordion-content>
  </p-accordion-panel>
</p-accordion>
