<div class="flex flex-row items-center gap-2 md:gap-x-4 pt-3">
  <span>
    {{ (averageRating() ?? 0).toFixed(1) }}/5
  </span>
  <div class="flex items-center gap-2">
    <p-rating [ngModel]="starRating()" [readonly]="true"/>
    <span class="text-gray-500">
      from {{ reviewsCount() ?? 0 }} reviews
    </span>
  </div>
</div>
