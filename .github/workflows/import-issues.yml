name: Import Issues 🤓
on:
  push:

env:
  FILE_PATH: 'issues.csv'

jobs:
  import-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Import Issues
        uses: dsanchezcr/issue-importer-action@v1.0.0
        with:
          file-path: ${{ env.FILE_PATH }}
          file-format: csv
          github-token: ${{ secrets.GITHUB_TOKEN }}
