services:
  db:
    image: postgres
    container_name: meet_map_postgres
    env_file: .env
    ports:
      - "5400:5432"
    shm_size: 128mb
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    container_name: meet_map
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - db
    profiles: [ backend ]

volumes:
  postgres_data:
